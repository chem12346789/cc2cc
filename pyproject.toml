[project]
name = "cc2cc"
version = "0.1.0"
description = "cc2cc: AI for density functional theory"
# Keep runtime dependencies in sync with requirements.txt.
dependencies = [
    "basis_set_exchange",
    "opt_einsum",
    "pyscf",
    "pyscf-dispersion",
    "wandb",
    "numba",
    "numpy",
    "torchinfo==1.8.0",
    "pandas",
    "openpyxl",
    "pytorch-optimizer==3.11.0",
]

[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "basis_set_exchange",
    "numpy",
    "opt_einsum",
    "pandas",
    "pyscf",
    "scipy",
    "segmentation_models_pytorch",
    "torch",
    "tqdm",
    "wandb",
    "setuptools >= 40.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cc2cc"]
exclude = []
namespaces = false

[tool.black]
line-length = 88

[tool.pyright]
reportGeneralTypeIssues = "warning"
reportArgumentType = "warning"
reportAttributeAccessIssue = "warning"
reportUndefinedVariable = "error"
reportOperatorIssue = false
reportCallIssue = false
reportOptionalMemberAccess = false
reportOptionalOperand = false
 reportPrivateImportUsage = false

[tool.pylance]
reportGeneralTypeIssues = "warning"
reportArgumentType = "warning"
reportUndefinedVariable = "error"
reportOperatorIssue = false
reportCallIssue = false
reportOptionalMemberAccess = false
reportOptionalOperand = false
 reportPrivateImportUsage = false